<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECHO — Every Choice Leaves a Future</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="main-menu">

        <!-- Background city -->
        <div class="city">

            <div class="sun"></div>

            <div class="buildings">
                <div class="building building-1"></div>
                <div class="building building-2"></div>
                <div class="building building-3"></div>
                <div class="building building-4"></div>
                <div class="building building-5"></div>
                <div class="building building-6"></div>
            </div>

            <div class="ground"></div>

        </div>

        <!-- Dark cinematic overlay -->
        <div class="overlay"></div>


        <!-- Main menu -->
        <section class="menu-content">

            <div class="eyebrow">
                A FUTURE SIMULATION
            </div>

            <h1>ECHO</h1>

            <p class="subtitle">
                EVERY CHOICE LEAVES A FUTURE
            </p>

            <div class="divider"></div>


            <div class="menu-buttons">

                <button id="start-button" class="primary-button">
                    BEGIN YOUR FUTURE
                </button>

                <button id="continue-button">
                    CONTINUE TIMELINE
                </button>

                <button id="about-button">
                    HOW ECHO WORKS
                </button>

            </div>


            <p id="menu-message"></p>


            <div class="footer">
                2026 — 2050 &nbsp; • &nbsp; BUILD THE WORLD YOU INHERIT
            </div>

        </section>

    </main>


    <script src="game.js"></script>

</body>
</html>
