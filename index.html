<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>CHOOSE YOUR CHARACTER</h1>

        <div class="character-container">

            <button class="character-card selected" data-character="warrior">
                <div class="sprite warrior"></div>
                <h2>WARRIOR</h2>
                <p>Strong & Brave</p>
            </button>

            <button class="character-card" data-character="mage">
                <div class="sprite mage"></div>
                <h2>MAGE</h2>
                <p>Wise & Powerful</p>
            </button>

            <button class="character-card" data-character="archer">
                <div class="sprite archer"></div>
                <h2>ARCHER</h2>
                <p>Fast & Precise</p>
            </button>

        </div>

        <div class="selected-info">
            <p>Selected:</p>
            <span id="selected-character">WARRIOR</span>
        </div>

        <button id="start-button">START GAME</button>

    </div>


    <script src="game.js"></script>
</body>
</html>
